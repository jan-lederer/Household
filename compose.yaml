name: dwell
services:
  dwell:
    build: .
    restart: unless-stopped
    ports:
      - "${DWELL_BIND_ADDRESS:-0.0.0.0}:${DWELL_HOST_PORT:-8081}:8080"
    environment:
      DWELL_PORT: "8080"
      DWELL_DB: /data/dwell.sqlite
      DWELL_WEB: /app/build/web
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
